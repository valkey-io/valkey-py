name: Docs CI

on:
  push:
    branches:
      - main
      - '[0-9].[0-9]'
  pull_request:
    branches:
      - main
      - '[0-9].[0-9]'
  schedule:
    - cron: '0 1 * * *' # nightly build

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-docs
  cancel-in-progress: true

permissions:
  contents: read  #  to fetch code (actions/checkout)

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:

   build-docs:
     name: Build docs
     runs-on: ubuntu-latest
     timeout-minutes: 5
     steps:
       - uses: actions/checkout@v7
       - uses: astral-sh/setup-uv@v10.3.0
         with:
           version: '0.13.0'
           # Set the python version to 3.12 to keep imghdr for sphinx.
           # TODO: update sphinx to remove imghdr dependency
           python-version: '3.12'
           activate-environment: true
           no-project: true
           enable-cache: true
           cache-dependency-glob: pyproject.toml
       - name: install deps
         run: |
           sudo apt-get update -yqq
           sudo apt-get install -yqq pandoc make
       - name: Build docs
         run: |
           uv pip install --group dev --group docs
           uv pip install .
           make -C docs html

       - name: upload docs
         uses: actions/upload-artifact@v7
         with:
           name: valkey-py-docs
           path: |
             docs/_build/html
